[package]
name = "codex-monitor-task-center"
version = "1.1.0"
description = "On-demand task center with explicit safe writes for the Codex Monitor product family"
authors = ["Ryua"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codex_monitor_task_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
time = { version = "0.3.55", features = ["formatting"] }
yaml_serde = "0.10.4"

[dev-dependencies]
tempfile = "3.26.0"
