name: Task Center CI

on:
  push:
    paths:
      - "task-center/**"
      - "docs/task-center/**"
      - ".github/workflows/task-center-ci.yml"
  pull_request:
    paths:
      - "task-center/**"
      - "docs/task-center/**"
      - ".github/workflows/task-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-mvp:
    name: ${{ matrix.platform }} read-only build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: task-center/package-lock.json

      - name: Set up stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install locked frontend dependencies
        working-directory: task-center
        run: npm ci

      - name: Run domain and component tests
        working-directory: task-center
        run: npm test

      - name: Run Rust read-boundary tests
        working-directory: task-center
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build platform application binary
        working-directory: task-center
        run: npm run tauri build -- --no-bundle
