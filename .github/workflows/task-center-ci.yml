name: Task Center CI

on:
  push:
    paths:
      - "task-center/**"
      - ".github/workflows/task-center-ci.yml"
  pull_request:
    paths:
      - "task-center/**"
      - ".github/workflows/task-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-mvp:
    name: ${{ matrix.platform }} read-only build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: task-center/package-lock.json

      - name: Set up locked Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install locked frontend dependencies
        working-directory: task-center
        run: npm ci

      - name: Run domain and component tests
        working-directory: task-center
        run: npm test

      - name: Run Rust read-boundary tests
        working-directory: task-center
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build platform application binary
        working-directory: task-center
        run: npm run tauri build -- --no-bundle

      - name: Record Windows build identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = New-Item -ItemType Directory -Force -Path ./task-center-ci-artifact
          $exe = (Resolve-Path ./task-center/src-tauri/target/release/codex-monitor-task-center.exe).Path
          Copy-Item -Force $exe $output.FullName
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            ($output.FullName + "/SHA256SUMS.txt"),
            "$hash  codex-monitor-task-center.exe`n",
            [System.Text.Encoding]::ASCII
          )
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), found $subsystem."
          }
          [ordered]@{
            fileVersion = $version.FileVersion
            productVersion = $version.ProductVersion
            bytes = (Get-Item $exe).Length
            sha256 = $hash
            peSubsystem = $subsystem
            peSubsystemName = "Windows GUI"
          } | ConvertTo-Json | Set-Content -Encoding utf8 -Path ($output.FullName + "/windows-build-identity.json")

      - name: Validate Windows native lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./task-center/tools/windows-lifecycle.ps1 `
            -Executable ./task-center/src-tauri/target/release/codex-monitor-task-center.exe `
            -OutputDirectory ./task-center-ci-artifact `
            -Cycles 20

      - name: Upload Windows evidence artifact
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: task-center-windows-x64-${{ github.run_attempt }}
          path: task-center-ci-artifact/
          if-no-files-found: warn
          retention-days: 14
