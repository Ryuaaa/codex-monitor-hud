name: Task Center CI

on:
  push:
    paths:
      - "task-center/**"
      - "docs/task-center/**"
      - ".github/workflows/task-center-ci.yml"
  pull_request:
    paths:
      - "task-center/**"
      - "docs/task-center/**"
      - ".github/workflows/task-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-mvp:
    name: ${{ matrix.platform }} read-only build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: task-center/package-lock.json

      - name: Set up locked Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install locked frontend dependencies
        working-directory: task-center
        run: npm ci

      - name: Run domain and component tests
        working-directory: task-center
        run: npm test

      - name: Run Rust read-boundary tests
        working-directory: task-center
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build platform application binary
        working-directory: task-center
        run: npm run tauri build -- --no-bundle

      - name: Validate Windows native lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./task-center/tools/windows-lifecycle.ps1 `
            -Executable ./task-center/src-tauri/target/release/codex-monitor-task-center.exe `
            -OutputDirectory ./task-center-ci-artifact `
            -Cycles 20

      - name: Upload Windows evidence artifact
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-center-windows-x64-${{ github.run_attempt }}
          path: task-center-ci-artifact/
          if-no-files-found: warn
          retention-days: 14
