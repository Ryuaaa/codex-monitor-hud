name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable SemVer tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify tag matches app version
        run: |
          release_tag="${{ inputs.release_tag }}"
          test -n "$(git tag --list "$release_tag")"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' overlay/Info.plist)"
          test "v$app_version" = "$release_tag"
      - name: Build and test
        run: |
          ./build-overlay.sh
          app="/private/tmp/codex-monitor-hud-build/Codex Monitor HUD.app/Contents/MacOS/CodexMonitorHUD"
          "$app" --logic-diagnostic
          "$app" --ui-diagnostic
          "$app" --update-diagnostic
          "$app" --singleton-diagnostic
          sh tests/test-codex-protocol.sh
          ./report.py --self-test
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          TEMP_KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/codex-monitor.keychain-db"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate"
          /usr/bin/security create-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$keychain"
          /usr/bin/security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$TEMP_KEYCHAIN_PASSWORD" "$keychain"
          /usr/bin/security list-keychains -d user -s "$keychain"
      - name: Sign and notarize release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./release-macos.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ inputs.release_tag }}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              Codex-Monitor-HUD.app.zip \
              Codex-Monitor-HUD.app.zip.sha256 \
              --clobber
          else
            gh release create "$release_tag" \
              Codex-Monitor-HUD.app.zip \
              Codex-Monitor-HUD.app.zip.sha256 \
              --verify-tag \
              --notes-file RELEASE_NOTES.md \
              --title "Codex Monitor HUD $release_tag"
          fi
