name: Windows signed release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Windows tag, for example windows-v1.0.0
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  windows-x64-signed-release:
    name: Build, sign, verify, and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    environment: windows-release

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify tag and source version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}"
          if ($tag -notmatch '^windows-v([0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Windows release tag must use windows-vMAJOR.MINOR.PATCH"
          }
          $tagVersion = $Matches[1]
          $cmake = Get-Content -LiteralPath "windows/CMakeLists.txt" -Raw
          if ($cmake -notmatch `
              'project\(CodexMonitorHUDWindows VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not read the Windows source version"
          }
          if ($Matches[1] -ne $tagVersion) {
            throw "Tag version $tagVersion does not match Windows source $($Matches[1])"
          }
          $tagCommit = (git rev-parse --verify "refs/tags/$tag^{commit}").Trim()
          $headCommit = (git rev-parse --verify HEAD).Trim()
          if ($headCommit -ne $tagCommit) {
            throw "Checked-out source $headCommit does not match release tag $tagCommit"
          }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release tag must point to a commit on the public main branch"
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S windows -B windows/out/build -A x64

      - name: Build and test Windows x64
        shell: pwsh
        run: |
          python windows/tests/static_checks.py
          cmake --build windows/out/build --config Release --parallel
          ctest --test-dir windows/out/build -C Release --output-on-failure

      - name: Build unsigned installer
        shell: pwsh
        run: |
          ./windows/build-installer.ps1 `
            -BinaryPath "windows/out/build/Release/CodexMonitorHUD.exe" `
            -OutputDirectory "windows/out/installer"

      - name: Upload unsigned files for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CodexMonitorHUD-windows-x64-${{ steps.version.outputs.version }}-unsigned
          path: |
            windows/out/build/Release/CodexMonitorHUD.exe
            windows/out/installer/CodexMonitorHUD-windows-x64-${{ steps.version.outputs.version }}.msi
          if-no-files-found: error
          retention-days: 1

      - name: Submit SignPath release-signing request
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-release-v1
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: windows/out/signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Locate and verify signed files
        id: signed
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $signedExe = @(Get-ChildItem -LiteralPath "windows/out/signed" `
            -Filter "CodexMonitorHUD.exe" -File -Recurse)
          $signedMsi = @(Get-ChildItem -LiteralPath "windows/out/signed" `
            -Filter "CodexMonitorHUD-windows-x64-$version.msi" -File -Recurse)
          if ($signedExe.Count -ne 1 -or $signedMsi.Count -ne 1) {
            throw "SignPath must return exactly one signed EXE and one signed MSI"
          }
          $exeSignature = Get-AuthenticodeSignature -LiteralPath $signedExe[0].FullName
          $msiSignature = Get-AuthenticodeSignature -LiteralPath $signedMsi[0].FullName
          if ($exeSignature.Status -ne "Valid" -or $msiSignature.Status -ne "Valid") {
            throw "SignPath returned a file without a valid Authenticode signature"
          }
          if ($exeSignature.SignerCertificate.Thumbprint -ne `
              $msiSignature.SignerCertificate.Thumbprint) {
            throw "Signed EXE and MSI use different publisher certificates"
          }
          $fingerprint = ($exeSignature.SignerCertificate.GetCertHashString(
            [Security.Cryptography.HashAlgorithmName]::SHA256)).ToLowerInvariant()
          if ($fingerprint -notmatch '^[0-9a-f]{64}$') {
            throw "The SignPath publisher fingerprint is invalid"
          }
          Copy-Item -LiteralPath $signedExe[0].FullName `
            -Destination "windows/out/build/Release/CodexMonitorHUD.exe" -Force
          Copy-Item -LiteralPath $signedMsi[0].FullName `
            -Destination "windows/out/installer/CodexMonitorHUD-windows-x64-$version.msi" -Force
          "publisher_sha256=$fingerprint" >> $env:GITHUB_OUTPUT

      - name: Rebuild with the exact signed publisher pin
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "windows/out/build" -Recurse -Force
          cmake -S windows -B windows/out/build -A x64 `
            "-DCODEX_MONITOR_WINDOWS_PUBLISHER_SHA256=${{ steps.signed.outputs.publisher_sha256 }}"
          cmake --build windows/out/build --config Release --parallel
          ctest --test-dir windows/out/build -C Release --output-on-failure

      - name: Build publisher-pinned installer
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "windows/out/installer" -Recurse -Force
          ./windows/build-installer.ps1 `
            -BinaryPath "windows/out/build/Release/CodexMonitorHUD.exe" `
            -OutputDirectory "windows/out/installer"

      - name: Upload publisher-pinned files for final SignPath signing
        id: upload-pinned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CodexMonitorHUD-windows-x64-${{ steps.version.outputs.version }}-publisher-pinned
          path: |
            windows/out/build/Release/CodexMonitorHUD.exe
            windows/out/installer/CodexMonitorHUD-windows-x64-${{ steps.version.outputs.version }}.msi
          if-no-files-found: error
          retention-days: 1

      - name: Submit final SignPath release-signing request
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-release-v1
          github-artifact-id: ${{ steps.upload-pinned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: windows/out/final-signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Verify publisher pin, package, and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $signedExe = @(Get-ChildItem -LiteralPath "windows/out/final-signed" `
            -Filter "CodexMonitorHUD.exe" -File -Recurse)
          $signedMsi = @(Get-ChildItem -LiteralPath "windows/out/final-signed" `
            -Filter "CodexMonitorHUD-windows-x64-$version.msi" -File -Recurse)
          if ($signedExe.Count -ne 1 -or $signedMsi.Count -ne 1) {
            throw "Final SignPath response must contain exactly one EXE and one MSI"
          }
          foreach ($file in @($signedExe[0], $signedMsi[0])) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Final artifact has no valid Authenticode signature: $($file.Name)"
            }
            $fingerprint = ($signature.SignerCertificate.GetCertHashString(
              [Security.Cryptography.HashAlgorithmName]::SHA256)).ToLowerInvariant()
            if ($fingerprint -ne "${{ steps.signed.outputs.publisher_sha256 }}") {
              throw "Final artifact publisher does not match the compiled pin"
            }
          }
          Copy-Item -LiteralPath $signedExe[0].FullName `
            -Destination "windows/out/build/Release/CodexMonitorHUD.exe" -Force
          Copy-Item -LiteralPath $signedMsi[0].FullName `
            -Destination "windows/out/installer/CodexMonitorHUD-windows-x64-$version.msi" -Force
          $msi = "windows/out/installer/CodexMonitorHUD-windows-x64-$version.msi"
          $msiHash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$msi.sha256", "$msiHash  $([IO.Path]::GetFileName($msi))`n", [Text.Encoding]::ASCII)
          ./windows/package-release.ps1 `
            -BinaryPath "windows/out/build/Release/CodexMonitorHUD.exe" `
            -OutputDirectory "windows/out/release"

      - name: Test signed MSI lifecycle and real upgrade
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = (Resolve-Path `
            "windows/out/installer/CodexMonitorHUD-windows-x64-$version.msi").Path
          $binary = (Resolve-Path `
            "windows/out/build/Release/CodexMonitorHUD.exe").Path
          ./windows/tests/test-msi-major-upgrade.ps1 `
            -CurrentBinaryPath $binary `
            -CurrentInstallerPath $installer `
            -ExpectedPublisherSha256 "${{ steps.signed.outputs.publisher_sha256 }}"

      - name: Publish signed Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          $assets = @(
            (Get-ChildItem -LiteralPath "windows/out/installer" `
              -Filter "CodexMonitorHUD-windows-x64-*.msi" -File).FullName,
            (Get-ChildItem -LiteralPath "windows/out/installer" `
              -Filter "CodexMonitorHUD-windows-x64-*.msi.sha256" -File).FullName,
            (Resolve-Path "windows/out/release/CodexMonitorHUD-windows-x64.zip").Path,
            (Resolve-Path "windows/out/release/CodexMonitorHUD-windows-x64.zip.sha256").Path
          )
          if ($assets.Count -ne 4 -or $assets -contains $null) {
            throw "The signed Windows release asset set is incomplete"
          }
          gh release create $tag @assets --verify-tag `
            --title "Codex Monitor HUD Windows ${{ steps.version.outputs.version }}" `
            --notes-file "WINDOWS_RELEASE_NOTES.md"
