name: Windows CI

on:
  push:
    branches:
      - codex/windows-development
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    branches:
      - codex/windows-development
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-release:
    name: MSVC x64 Release
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Windows source contract checks
        run: python windows/tests/static_checks.py

      - name: Configure with MSVC
        run: >-
          cmake -S windows -B windows/out/build
          -G "Visual Studio 17 2022" -A x64

      - name: Build Release executable
        run: cmake --build windows/out/build --config Release --parallel

      - name: Verify build output
        shell: pwsh
        run: |
          $binary = "windows/out/build/Release/CodexMonitorHUD.exe"
          if (-not (Test-Path -Path $binary -PathType Leaf)) {
            throw "Expected Windows executable was not produced: $binary"
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CodexMonitorHUD-windows-x64-release
          path: windows/out/build/Release/CodexMonitorHUD.exe
          if-no-files-found: error
          retention-days: 14
