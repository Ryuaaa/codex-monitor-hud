name: Windows CI

on:
  push:
    branches:
      - main
      - codex/windows-development
    paths:
      - "windows/**"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    branches:
      - main
      - codex/windows-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-release:
    name: MSVC x64 Release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Windows source contract checks
        run: python windows/tests/static_checks.py

      - name: Configure with installed MSVC
        run: cmake -S windows -B windows/out/build -A x64

      - name: Build Release executable
        run: cmake --build windows/out/build --config Release --parallel

      - name: Run Release tests
        run: ctest --test-dir windows/out/build -C Release --output-on-failure

      - name: Verify build output
        shell: pwsh
        run: |
          $binary = "windows/out/build/Release/CodexMonitorHUD.exe"
          if (-not (Test-Path -Path $binary -PathType Leaf)) {
            throw "Expected Windows executable was not produced: $binary"
          }
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw "Build output is not a valid PE executable"
          }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
              $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
            throw "Build output has an invalid PE header"
          }
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw "Build output is not an x64 PE executable"
          }
          $cmake = Get-Content -LiteralPath "windows/CMakeLists.txt" -Raw
          if ($cmake -notmatch 'project\(CodexMonitorHUDWindows VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not read the expected Windows version"
          }
          $expectedVersion = $Matches[1]
          $versionInfo = (Get-Item -LiteralPath $binary).VersionInfo
          if ($versionInfo.FileVersion -ne $expectedVersion -or
              $versionInfo.ProductVersion -ne $expectedVersion) {
            throw "PE version metadata does not match CMake: expected $expectedVersion, got file=$($versionInfo.FileVersion) product=$($versionInfo.ProductVersion)"
          }

      - name: Test release signing helper
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $parseErrors = $null
          $scriptPath = (Resolve-Path -LiteralPath `
            "windows/sign-release-artifacts.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw "The release signing helper contains a PowerShell parse error"
          }

          $passwordText = [guid]::NewGuid().ToString("N")
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $pfxPath = Join-Path $env:RUNNER_TEMP `
            ("codex-monitor-signing-helper-" + [guid]::NewGuid().ToString("N") + ".pfx")
          $certificate = $null
          try {
            $certificate = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject ("CN=Codex Monitor HUD Signing Helper CI " + `
                $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT) `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -KeyExportPolicy Exportable `
              -NotBefore (Get-Date).AddMinutes(-5) `
              -NotAfter (Get-Date).AddHours(2)
            Export-PfxCertificate `
              -Cert $certificate `
              -FilePath $pfxPath `
              -Password $password | Out-Null
            $fingerprint = & $scriptPath `
              -Action Fingerprint `
              -CertificatePath $pfxPath `
              -CertificatePassword $passwordText
            if ($fingerprint -notmatch '^[0-9a-f]{64}$') {
              throw "The release signing helper returned an invalid fingerprint"
            }
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              $expectedFingerprint = -join (
                $sha256.ComputeHash($certificate.RawData) |
                  ForEach-Object { $_.ToString("x2") })
            } finally {
              $sha256.Dispose()
            }
            if ($fingerprint -ne $expectedFingerprint) {
              throw "The release signing helper fingerprint is incorrect"
            }
          } finally {
            if ($null -ne $certificate) {
              $storePath = "Cert:\CurrentUser\My\$($certificate.Thumbprint)"
              if (Test-Path -LiteralPath $storePath) {
                Remove-Item -LiteralPath $storePath -DeleteKey -Force
              }
              $certificate.Dispose()
            }
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force
            }
          }

      - name: Create portable Windows package
        shell: pwsh
        run: |
          ./windows/package-release.ps1 `
            -BinaryPath "windows/out/build/Release/CodexMonitorHUD.exe" `
            -OutputDirectory "windows/out/release"

      - name: Verify portable package and checksum
        shell: pwsh
        run: |
          $archive = "windows/out/release/CodexMonitorHUD-windows-x64.zip"
          $checksum = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Expected Windows archive was not produced: $archive"
          }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "Expected SHA-256 file was not produced: $checksum"
          }

          $expectedHash = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
            throw "Windows archive SHA-256 verification failed"
          }

          $expanded = Join-Path $env:RUNNER_TEMP "codex-monitor-package-check"
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $root = Join-Path $expanded "CodexMonitorHUD-windows-x64"
          foreach ($required in @("CodexMonitorHUD.exe", "LICENSE", "README.md")) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $required) -PathType Leaf)) {
              throw "Windows archive is missing required file: $required"
            }
          }
          $expectedFiles = @("CodexMonitorHUD.exe", "LICENSE", "README.md") | Sort-Object
          $actualFiles = @(Get-ChildItem -LiteralPath $root -File | ForEach-Object Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expectedFiles -DifferenceObject $actualFiles) {
            throw "Windows archive contains an unexpected file set"
          }
          $sourceHash = (Get-FileHash -LiteralPath "windows/out/build/Release/CodexMonitorHUD.exe" -Algorithm SHA256).Hash
          $packagedHash = (Get-FileHash -LiteralPath (Join-Path $root "CodexMonitorHUD.exe") -Algorithm SHA256).Hash
          if ($sourceHash -ne $packagedHash) {
            throw "Packaged executable does not match the tested build output"
          }

      - name: Build per-user Windows MSI
        shell: pwsh
        run: |
          ./windows/build-installer.ps1 `
            -BinaryPath "windows/out/build/Release/CodexMonitorHUD.exe" `
            -OutputDirectory "windows/out/installer"

      - name: Test Windows Installer version limits
        shell: pwsh
        run: |
          $dummyBinary = Join-Path $env:RUNNER_TEMP "version-limit-fixture.exe"
          [System.IO.File]::WriteAllBytes($dummyBinary, [byte[]](0x4d, 0x5a))
          foreach ($invalidVersion in @("256.0.0", "0.256.0", "0.0.65536")) {
            try {
              ./windows/build-installer.ps1 `
                -BinaryPath $dummyBinary `
                -OutputDirectory (Join-Path $env:RUNNER_TEMP "invalid-msi") `
                -Version $invalidVersion
              throw "Invalid MSI version was accepted: $invalidVersion"
            } catch {
              if ($_.Exception.Message -notlike "*exceeds Windows Installer limits*") {
                throw
              }
            }
          }

      - name: Test MSI install and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "windows/out/installer" `
            -Filter "CodexMonitorHUD-windows-x64-*.msi" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows MSI, found $($installers.Count)"
          }
          $installer = $installers[0]
          $checksum = "$($installer.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "Expected MSI SHA-256 file was not produced"
          }
          $expectedHash = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
            throw "Windows MSI SHA-256 verification failed"
          }

          $installDirectory = Join-Path $env:RUNNER_TEMP "Codex Monitor HUD"
          $installLog = Join-Path $env:RUNNER_TEMP "codex-monitor-msi-install.log"
          $installArguments = "/i `"$($installer.FullName)`" /qn /norestart " +
            "INSTALLFOLDER=`"$installDirectory`" /L*v `"$installLog`""
          $install = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList $installArguments
          if ($install.ExitCode -notin @(0, 3010)) {
            Get-Content -LiteralPath $installLog -Tail 100
            throw "Silent MSI installation failed with exit code $($install.ExitCode)"
          }

          $installedBinary = Join-Path $installDirectory "CodexMonitorHUD.exe"
          foreach ($required in @("CodexMonitorHUD.exe", "LICENSE", "README.md")) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDirectory $required) -PathType Leaf)) {
              throw "MSI installation is missing required file: $required"
            }
          }
          $sourceHash = (Get-FileHash -LiteralPath "windows/out/build/Release/CodexMonitorHUD.exe" -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash -LiteralPath $installedBinary -Algorithm SHA256).Hash
          if ($sourceHash -ne $installedHash) {
            throw "Installed executable does not match the tested build output"
          }

          $uninstallLog = Join-Path $env:RUNNER_TEMP "codex-monitor-msi-uninstall.log"
          $uninstallArguments = "/x `"$($installer.FullName)`" /qn /norestart " +
            "/L*v `"$uninstallLog`""
          $uninstall = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList $uninstallArguments
          if ($uninstall.ExitCode -notin @(0, 3010)) {
            Get-Content -LiteralPath $uninstallLog -Tail 100
            throw "Silent MSI uninstall failed with exit code $($uninstall.ExitCode)"
          }
          $uninstallDeadline = [DateTime]::UtcNow.AddSeconds(10)
          while ((Test-Path -LiteralPath $installedBinary) -and
                 [DateTime]::UtcNow -lt $uninstallDeadline) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $installedBinary) {
            Get-Content -LiteralPath $uninstallLog -Tail 100
            throw "MSI uninstall left the application executable behind"
          }

      - name: Test real MSI major upgrade from 0.2.0
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "windows/out/installer" `
            -Filter "CodexMonitorHUD-windows-x64-*.msi" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one current Windows MSI, found $($installers.Count)"
          }
          ./windows/tests/test-msi-major-upgrade.ps1 `
            -CurrentBinaryPath "windows/out/build/Release/CodexMonitorHUD.exe" `
            -CurrentInstallerPath $installers[0].FullName

      - name: Test Authenticode publisher pin against built MSI
        # Keep the ephemeral signing key only in CurrentUser\My. Hosted runners
        # have repeatedly stalled while mutating Root/TrustedPublisher, so the
        # dedicated test binary accepts only CERT_E_UNTRUSTEDROOT for this
        # pinned fixture. The production HUD does not compile that test gate.
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $installers = @(Get-ChildItem -LiteralPath "windows/out/installer" `
            -Filter "CodexMonitorHUD-windows-x64-*.msi" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows MSI, found $($installers.Count)"
          }

          $applyTransactionTest = (Resolve-Path -LiteralPath `
            "windows/out/build/Release/CodexMonitorUpdateApplyTransactionTests.exe").Path
          $cmake = Get-Content -LiteralPath "windows/CMakeLists.txt" -Raw
          if ($cmake -notmatch `
              'project\(CodexMonitorHUDWindows VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not read the expected Windows version"
          }
          $expectedVersion = $Matches[1]

          $windowsKitsBin = Join-Path ${env:ProgramFiles(x86)} `
            "Windows Kits\10\bin"
          $signTool = Get-ChildItem -LiteralPath $windowsKitsBin -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object {
              $candidate = Join-Path $_.FullName "x64\signtool.exe"
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $candidate
              }
            } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($signTool)) {
            throw "Could not find the x64 Windows SDK signtool.exe"
          }

          $temporaryDirectory = Join-Path $env:RUNNER_TEMP `
            ("codex-monitor-authenticode-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $temporaryDirectory | Out-Null
          $signedInstaller = Join-Path $temporaryDirectory $installers[0].Name
          Copy-Item -LiteralPath $installers[0].FullName `
            -Destination $signedInstaller
          $signedInstaller = (Resolve-Path -LiteralPath $signedInstaller).Path

          $certificate = $null
          $storeThumbprintSha1 = $null
          $transactionInstallDirectory = Join-Path $env:LOCALAPPDATA `
            "Programs\Codex Monitor HUD"
          $transactionInstalledBinary = Join-Path `
            $transactionInstallDirectory "CodexMonitorHUD.exe"
          try {
            Write-Host "phase=certificate-create start"
            $certificate = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject ("CN=Codex Monitor HUD CI " + $env:GITHUB_RUN_ID + `
                "-" + $env:GITHUB_RUN_ATTEMPT) `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -KeyExportPolicy NonExportable `
              -NotBefore (Get-Date).AddMinutes(-5) `
              -NotAfter (Get-Date).AddHours(2)
            $storeThumbprintSha1 = $certificate.Thumbprint
            Write-Host "phase=certificate-create done"

            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              $publisherPinSha256 = -join (
                $sha256.ComputeHash($certificate.RawData) |
                  ForEach-Object { $_.ToString("x2") })
            } finally {
              $sha256.Dispose()
            }
            if ($publisherPinSha256.Length -ne 64) {
              throw "The CI publisher certificate SHA-256 pin is invalid"
            }

            Write-Host "phase=signtool-sign start"
            & $signTool sign /fd SHA256 /sha1 $storeThumbprintSha1 `
              /s My $signedInstaller
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed with exit code $LASTEXITCODE"
            }
            Write-Host "phase=signtool-sign done"

            $signedInstallerSha256 = (Get-FileHash -LiteralPath `
              $signedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()

            Write-Host "phase=apply-transaction-locks start"
            & $applyTransactionTest --verify-apply-signed-msi `
              $signedInstaller $expectedVersion $publisherPinSha256 `
              $signedInstallerSha256 installed
            if ($LASTEXITCODE -ne 0) {
              throw "The signed MSI did not remain locked through the apply callback"
            }
            Write-Host "phase=apply-transaction-locks done"

            Write-Host "phase=apply-transaction-real-install start"
            & $applyTransactionTest --install-signed-msi `
              $signedInstaller $expectedVersion $publisherPinSha256 `
              $signedInstallerSha256
            if ($LASTEXITCODE -ne 0) {
              throw "The production apply transaction did not complete the signed MSI install"
            }
            if (-not (Test-Path -LiteralPath $transactionInstalledBinary `
                -PathType Leaf)) {
              throw "The production apply transaction did not install the HUD executable"
            }
            $sourceHash = (Get-FileHash -LiteralPath `
              "windows/out/build/Release/CodexMonitorHUD.exe" `
              -Algorithm SHA256).Hash
            $transactionHash = (Get-FileHash -LiteralPath `
              $transactionInstalledBinary -Algorithm SHA256).Hash
            if ($sourceHash -ne $transactionHash) {
              throw "The transaction-installed executable does not match the tested build"
            }
            Write-Host "phase=apply-transaction-real-install done"

            $wrongFirstCharacter = if ($publisherPinSha256[0] -eq '0') {
              '1'
            } else {
              '0'
            }
            $wrongPublisherPin = $wrongFirstCharacter + `
              $publisherPinSha256.Substring(1)
            Write-Host "phase=apply-transaction-wrong-pin start"
            & $applyTransactionTest --verify-apply-signed-msi `
              $signedInstaller $expectedVersion $wrongPublisherPin `
              $signedInstallerSha256 publisher-rejected
            if ($LASTEXITCODE -ne 0) {
              throw "The apply transaction invoked the callback for a wrong publisher pin"
            }
            Write-Host "phase=apply-transaction-wrong-pin done"

            $wrongInstallerSha256 = if ($signedInstallerSha256[0] -eq '0') {
              '1' + $signedInstallerSha256.Substring(1)
            } else {
              '0' + $signedInstallerSha256.Substring(1)
            }
            Write-Host "phase=apply-transaction-wrong-checksum start"
            & $applyTransactionTest --verify-apply-signed-msi `
              $signedInstaller $expectedVersion $publisherPinSha256 `
              $wrongInstallerSha256 checksum-rejected
            if ($LASTEXITCODE -ne 0) {
              throw "The apply transaction invoked the callback for a wrong checksum"
            }
            Write-Host "phase=apply-transaction-wrong-checksum done"

            $tamperedDirectory = Join-Path $temporaryDirectory "tampered"
            New-Item -ItemType Directory -Path $tamperedDirectory | Out-Null
            $tamperedInstaller = Join-Path $tamperedDirectory `
              $installers[0].Name
            Copy-Item -LiteralPath $signedInstaller `
              -Destination $tamperedInstaller
            & $applyTransactionTest --tamper-msi-product-name `
              $tamperedInstaller
            if ($LASTEXITCODE -ne 0) {
              throw "Could not mutate signed MSI content for the signature test"
            }
            $tamperedInstallerSha256 = (Get-FileHash -LiteralPath `
              $tamperedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "phase=apply-transaction-tampered start"
            & $applyTransactionTest --verify-apply-signed-msi `
              $tamperedInstaller $expectedVersion $publisherPinSha256 `
              $tamperedInstallerSha256 signature-rejected
            if ($LASTEXITCODE -ne 0) {
              throw "The apply transaction accepted a tampered signed MSI"
            }
            Write-Host "phase=apply-transaction-tampered done"
          } finally {
            Write-Host "phase=cleanup start"
            $cleanupFailed = $false
            try {
              $transactionUninstallLog = Join-Path $env:RUNNER_TEMP `
                "codex-monitor-transaction-uninstall.log"
              $transactionUninstallArguments = `
                "/x `"$signedInstaller`" /qn /norestart " +
                "/L*v `"$transactionUninstallLog`""
              $transactionUninstall = Start-Process msiexec.exe `
                -Wait -PassThru -ArgumentList $transactionUninstallArguments
              if ($transactionUninstall.ExitCode -notin @(0, 1605, 3010)) {
                $cleanupFailed = $true
                if (Test-Path -LiteralPath $transactionUninstallLog) {
                  Get-Content -LiteralPath $transactionUninstallLog -Tail 100
                }
                Write-Warning `
                  "Failed to remove the transaction-installed MSI"
              }
              if (Test-Path -LiteralPath $transactionInstalledBinary) {
                $cleanupFailed = $true
              }
            } catch {
              $cleanupFailed = $true
              Write-Warning "Failed to run transaction MSI cleanup"
            }
            if (-not [string]::IsNullOrWhiteSpace($storeThumbprintSha1)) {
              $certificatePath = `
                "Cert:\CurrentUser\My\$storeThumbprintSha1"
              try {
                if (Test-Path -LiteralPath $certificatePath) {
                  Remove-Item -LiteralPath $certificatePath `
                    -DeleteKey -Force -ErrorAction Stop
                }
                if (Test-Path -LiteralPath $certificatePath) {
                  $cleanupFailed = $true
                }
              } catch {
                $cleanupFailed = $true
                Write-Warning "Failed to remove the CI signing certificate"
              }
            }
            if ($null -ne $certificate) {
              $certificate.Dispose()
            }
            try {
              if (Test-Path -LiteralPath $temporaryDirectory) {
                Remove-Item -LiteralPath $temporaryDirectory `
                  -Recurse -Force -ErrorAction Stop
              }
            } catch {
              $cleanupFailed = $true
              Write-Warning "Failed to remove the Authenticode test directory"
            }
            if ($cleanupFailed) {
              throw "Authenticode CI test cleanup was incomplete"
            }
            Write-Host "phase=cleanup done"
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: CodexMonitorHUD-windows-x64-release
          path: windows/out/build/Release/CodexMonitorHUD.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v7
        with:
          name: CodexMonitorHUD-windows-x64-portable
          path: |
            windows/out/release/CodexMonitorHUD-windows-x64.zip
            windows/out/release/CodexMonitorHUD-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Windows MSI
        uses: actions/upload-artifact@v7
        with:
          name: CodexMonitorHUD-windows-x64-msi-unsigned
          path: |
            windows/out/installer/CodexMonitorHUD-windows-x64-*.msi
            windows/out/installer/CodexMonitorHUD-windows-x64-*.msi.sha256
          if-no-files-found: error
          retention-days: 14
